<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cite — AI Document Q&A with Citations</title>
    <meta name="description" content="Upload documents, ask questions, get AI answers with source citations." />

    <!-- Preload body font for zero layout shift -->
    <link
      rel="preload"
      href="https://cdn.fontshare.com/wf/ZFUFCZKNPFBMJQ7YLOCSRGUXLCCJBEYB/DCTG6E72NTEX7FJ4W2L5C5XC4H7BO4QL/PCUIHFNF637JHQBWXN5LXOXILM4B2AUP.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Google Fonts (loaded in HTML to avoid CSS @import ordering issues) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Theme initialization — runs before first paint to prevent flash -->
    <script>
      (function() {
        var stored = localStorage.getItem('cite-theme');
        var theme = 'light';
        if (stored === 'dark') {
          theme = 'dark';
        } else if (stored === 'light') {
          theme = 'light';
        } else {
          // "system" or not set — follow OS preference
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
